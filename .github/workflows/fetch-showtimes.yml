name: Fetch Showtimes

# Data-only: refreshes theater-{id}.json in Supabase Storage for every
# followed theater. The web/Expo apps read straight from Storage, and
# Vercel auto-deploys the site on push — this workflow no longer builds or
# deploys anything.
on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch showtimes for followed theaters
        env:
          AMC_API_KEY: ${{ secrets.AMC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/fetch_showtimes.py
