name: Sync Theaters

# Refreshes the `theaters` table from AMC's ~550-theater directory. This is
# what the in-app theater picker searches — run infrequently since the
# directory itself rarely changes.
on:
  schedule:
    - cron: '0 6 * * 1'   # weekly, Monday 6am UTC
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Sync theaters
        env:
          AMC_API_KEY: ${{ secrets.AMC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/sync_theaters.py
